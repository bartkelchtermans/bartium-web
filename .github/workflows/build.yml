name: Build

# Every push to master: build the multi-arch site image, push it to GHCR as
# :sha-<commit>, then pin that tag into deploy/swarm/compose.yaml and commit.
# Arcane Git-Syncs the compose and redeploys on that commit — the image tag
# in git IS the deploy, so rollback is `git revert` of the bump.
#
# The bump commit cannot loop: pushes made with GITHUB_TOKEN never trigger
# workflows, and it carries [skip ci] as a belt to that brace.

on:
  push:
    branches: [master]
    # Docs and the compose do not change the image. Building on them would
    # pin a new sha that nobody deploys and leave git and the swarm
    # disagreeing about which commit is live.
    paths-ignore:
      - '**.md'
      - 'deploy/swarm/compose.yaml'
  workflow_dispatch:

# Never cancel: two bump commits racing on master is a failed push for nothing.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      # The Pis are arm64; the runner is amd64. There is no build step to
      # emulate — the image is nginx + a COPY — so QEMU only carries the
      # file copy on the arm64 leg.
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  pin:
    name: Pin image in compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master

      - name: Pin the built image and commit
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Fail loudly when the pattern does not match. Without these two guards a
          # non-matching sed is indistinguishable from "already pinned": sed exits 0
          # having changed nothing, git diff then reports no change, and the job goes
          # green while compose.yaml still names the previous sha — the site silently
          # stops receiving deploys. A hand-edit that quotes the value, or any YAML
          # formatter, is enough to trigger it.
          grep -qE "^[[:space:]]*image: ghcr\.io/${REPO}:" deploy/swarm/compose.yaml || {
            echo "::error::no 'image: ghcr.io/${REPO}:...' line in deploy/swarm/compose.yaml — the pin pattern did not match; refusing to no-op silently"
            exit 1
          }
          sed -i -E "s#^([[:space:]]*image: ghcr\.io/${REPO}:).*#\1sha-${SHA}#" deploy/swarm/compose.yaml
          grep -qF "image: ghcr.io/${REPO}:sha-${SHA}" deploy/swarm/compose.yaml || {
            echo "::error::compose.yaml does not name sha-${SHA} after the rewrite — the pin did not take"
            exit 1
          }
          # Only now does "no diff" unambiguously mean "already at this sha".
          git diff --exit-code --quiet deploy/swarm/compose.yaml && { echo "already pinned"; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore(deploy): swarm → sha-${SHA:0:12} [skip ci]"
          git push origin master
